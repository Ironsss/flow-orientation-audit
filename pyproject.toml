[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iag-symmetry"
version = "0.1.0"
description = "Graph Asymmetry Index (IAG) for network intrusion detection"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "IAG Research Team"},
]

dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "networkx>=3.0",  # src/viz/plots.py::plot_interaction_graph, real layout of host graphs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
